plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.mathenic.mathenic"
    ndkVersion = flutter.ndkVersion
    compileSdk = 36  // Latest stable

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17  // Updated to Java 17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"  // Updated to Java 17
    }

    defaultConfig {
        applicationId = "com.mathenic.mathenic"
        minSdk = 33
        targetSdk = 36  // Changed from flutter.targetSdkVersion
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}